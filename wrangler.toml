name = "snippet-hub"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# 静态页面（public/）由 Workers Static Assets 托管；/api/* 一律进 Worker
assets = { directory = "./public", binding = "ASSETS", run_worker_first = ["/api/*"] }

[vars]
AUTH_USER = "admin"

[[d1_databases]]
binding = "DB"
database_name = "snippet-hub"
database_id = "8269294a-e58d-4466-9f41-cab256f9dbd2"
